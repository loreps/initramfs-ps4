name: Build and Update Highly Unstable

on:
  push:
    branches: [highly-unstable]

enable-openid-connect: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(forgejo.event.head_commit.message, 'nobuild') }}

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cpio
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio

      - name: Fetch private firmware
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 \
            https://github.com/GayCorp/initramfs-ps4-private.git \
            "$TEMP_DIR/firmware"

          test -d "$TEMP_DIR/firmware/amdgpu"
          test -d "$TEMP_DIR/firmware/mrvl"

          mkdir -p rootfs/lib/firmware

          cp -a "$TEMP_DIR/firmware/amdgpu" rootfs/lib/firmware/
          cp -a "$TEMP_DIR/firmware/mrvl" rootfs/lib/firmware/

          echo "Private firmware copied successfully."
          du -sh rootfs/lib/firmware/amdgpu rootfs/lib/firmware/mrvl

      - name: Make bake.sh executable
        run: chmod +x scripts/bake.sh

      - name: Run bake.sh
        run: ./scripts/bake.sh -production

      - name: Verify archive
        run: |
          set -eu

          test -s dist/initramfs.cpio.gz

          echo "--- Archive size ---"
          ls -lh dist/initramfs.cpio.gz

          echo "--- Archive contents (first 20 entries) ---"
          zcat dist/initramfs.cpio.gz | cpio -it --quiet | head -20

          echo "--- Total entries ---"
          zcat dist/initramfs.cpio.gz | cpio -it --quiet | wc -l

          echo "--- Verify firmware is included ---"
          zcat dist/initramfs.cpio.gz | cpio -it --quiet |
            grep -E '^(\./)?lib/firmware/(amdgpu|mrvl)/'

      - name: Upload build artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: initramfs-highly-unstable-${{ forgejo.sha }}
          path: dist/initramfs.cpio.gz
          retention-days: 30

      - name: Update highly-unstable prerelease
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          RELEASE_AUDIENCE: ${{ vars.RELEASE_AUDIENCE }}
          COMMIT_SHA: ${{ forgejo.sha }}
        run: |
          set -eu

          JWT="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RELEASE_AUDIENCE" | jq -r '.value')"
          API="$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY"
          AUTH_HEADER="Authorization: Bearer $JWT"
          RELEASE_FILE="$(mktemp)"
          trap 'rm -f "$RELEASE_FILE"' EXIT
          STATUS="$(curl --silent --show-error -o "$RELEASE_FILE" -w '%{http_code}' -H "$AUTH_HEADER" "$API/releases/tags/highly-unstable")"

          RELEASE_JSON="$(jq -n --arg commit "$COMMIT_SHA" \
            '{tag_name:"highly-unstable",name:"Highly unstable (bleeding edge)",body:("Rolling prerelease — always the newest successful build from `highly-unstable`.\n\n**Commit:** " + $commit + "\n**Archive:** `initramfs.cpio.gz`"),draft:false,prerelease:true,make_latest:"false"}')"

          if [ "$STATUS" = 404 ]; then
            RELEASE="$(curl --fail --silent --show-error \
              -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
              -d "$RELEASE_JSON" "$API/releases")"
          elif [ "$STATUS" -ge 400 ]; then
            cat "$RELEASE_FILE"
            exit 1
          else
            RELEASE="$(cat "$RELEASE_FILE")"
            RELEASE_ID="$(printf '%s' "$RELEASE" | jq -r '.id')"
            curl --fail --silent --show-error -X PATCH \
              -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
              -d "$(printf '%s' "$RELEASE_JSON" | jq 'del(.tag_name)')" \
              "$API/releases/$RELEASE_ID" >/dev/null

            printf '%s' "$RELEASE" | jq -r '.assets[]?.id' | while IFS= read -r ASSET_ID; do
              curl --fail --silent --show-error -X DELETE \
                -H "$AUTH_HEADER" "$API/releases/$RELEASE_ID/assets/$ASSET_ID"
            done
          fi

          RELEASE_ID="$(printf '%s' "$RELEASE" | jq -r '.id')"
          test -n "$RELEASE_ID"
          test "$RELEASE_ID" != null

          curl --fail --silent --show-error \
            -H "$AUTH_HEADER" -H 'Content-Type: application/gzip' \
            --data-binary @dist/initramfs.cpio.gz \
            "$API/releases/$RELEASE_ID/assets?name=initramfs.cpio.gz"